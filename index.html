<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surgical Planning PoC</title>
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div id="app"></div>

  <div id="top-bar">
    <div id="status-bar">
      <div class="state">Initializing...</div>
      <div class="last-command"></div>
    </div>
    <div id="record-btn" aria-label="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
        <polyline points="21 3 21 9 15 9"/>
      </svg>
    </div>
  </div>

  <div id="controls-bar">
    <div class="command-shelf" data-vel-plugin="CommandShelf" data-vel-view="root">
      <div class="dock-items">

        <button id="mode-toggle" class="item" data-vel-view="item" data-tooltip="Single Cut" aria-label="Toggle cut mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="8"  x2="20" y2="8"/>
            <line x1="4" y1="16" x2="20" y2="16"/>
          </svg>
        </button>

        <div class="dock-separator"></div>

        <button class="item" data-cmd="up" data-vel-view="item" data-tooltip="Up" aria-label="Move plane up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"/>
          </svg>
        </button>

        <button class="item" data-cmd="down" data-vel-view="item" data-tooltip="Down" aria-label="Move plane down">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <div class="dock-separator"></div>

        <button class="item" data-cmd="cut" data-vel-view="item" data-tooltip="Cut" aria-label="Execute cut">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6"  cy="6"  r="3"/>
            <circle cx="6"  cy="18" r="3"/>
            <line x1="20" y1="4"  x2="8.12" y2="15.88"/>
            <line x1="14.47" y1="14.48" x2="20" y2="20"/>
            <line x1="8.12"  y1="8.12"  x2="12" y2="12"/>
          </svg>
        </button>

        <div class="dock-separator"></div>

        <button class="item" data-cmd="toggle_proximal" data-vel-view="item" data-tooltip="Toggle Proximal" aria-label="Toggle proximal segment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="7" rx="1"/>
            <path d="M1 17s3-3 5-3 4 3 6 3 4-3 6-3 3 3 5 3"/>
            <line x1="3" y1="21" x2="21" y2="21"/>
          </svg>
        </button>

        <button class="item" data-cmd="toggle_middle" data-vel-view="item" data-tooltip="Toggle Middle" aria-label="Toggle middle segment" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="9" width="18" height="6" rx="1"/>
            <path d="M1 19s3-3 5-3 4 3 6 3 4-3 6-3 3 3 5 3"/>
            <line x1="3" y1="23" x2="21" y2="23"/>
          </svg>
        </button>

        <button class="item" data-cmd="toggle_distal" data-vel-view="item" data-tooltip="Toggle Distal" aria-label="Toggle distal segment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="14" width="18" height="7" rx="1"/>
            <path d="M1 10s3-3 5-3 4 3 6 3 4-3 6-3 3 3 5 3"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
